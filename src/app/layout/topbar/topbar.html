<mat-toolbar class="topbar">
  <div class="left">
    <span class="title">Hya Naqra'a</span>
    <span class="badge-tag">Admin Portal</span>
  </div>

  <div class="right">
    <div class="user-profile">
      <div class="avatar">{{ (displayName || 'U').charAt(0).toUpperCase() }}</div>
      <span class="user-name">{{ displayName || 'User Admin' }}</span>
    </div>

    <button mat-stroked-button class="logout-btn" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </div>
</mat-toolbar>
