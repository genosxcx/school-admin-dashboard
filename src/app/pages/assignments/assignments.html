<div class="assignments-container">
  
  <div class="header-section">
    <div class="header-title">
      <h1>Assignments</h1>
      <p class="subtitle">Manage and track student tasks</p>
    </div>

    <div class="header-actions">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search assignments...</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [(ngModel)]="q" />
        <button *ngIf="q" matSuffix mat-icon-button (click)="q = ''"><mat-icon>close</mat-icon></button>
      </mat-form-field>

      <button mat-flat-button class="add-btn" (click)="addAssignment()" [disabled]="loading || !schoolId">
        <mat-icon>add</mat-icon>
        <span>Create Assignment</span>
      </button>
    </div>
  </div>

  <div class="error-msg" *ngIf="error">{{ error }}</div>

  <mat-card class="table-card">
    <mat-card-content>
      <div class="loading-overlay" *ngIf="loading">Loading assignments...</div>

      <table mat-table [dataSource]="filtered" class="full-width-table">
        
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef> Title </th>
          <td mat-cell *matCellDef="let a"> <span class="title-text">{{ a.title }}</span> </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Description </th>
          <td mat-cell *matCellDef="let a" class="desc-text"> {{ a.description || '-' }} </td>
        </ng-container>

        <ng-container matColumnDef="classes">
          <th mat-header-cell *matHeaderCellDef> Assigned To </th>
          <td mat-cell *matCellDef="let a"> <span class="classes-pill">{{ classesLabel(a) }}</span> </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Created On </th>
          <td mat-cell *matCellDef="let a"> <span class="date-pill">{{ a.createdAt | date:'mediumDate' }}</span> </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef style="text-align: right;"></th>
          <td mat-cell *matCellDef="let a">
            <div class="action-buttons">
              <button mat-icon-button class="delete-btn" (click)="deleteAssignment(a)" matTooltip="Delete Assignment">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
        <tr *matNoDataRow>
          <td colspan="5" class="loading-overlay">No assignments found. Create one to get started!</td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
