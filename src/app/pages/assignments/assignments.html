<div class="header-actions">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search assignments...</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput [(ngModel)]="q" />
    <button *ngIf="q" matSuffix mat-icon-button (click)="q = ''">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <button mat-flat-button color="primary" (click)="addAssignment()" [disabled]="loading || !schoolId">
    <mat-icon>add</mat-icon>
    Create Assignment
  </button>
</div>

<div class="error-msg" *ngIf="error">{{ error }}</div>

<mat-card class="table-card">
  <mat-card-content>
    <div class="loading-overlay" *ngIf="loading">
      <p>Loading...</p>
    </div>

    <table mat-table [dataSource]="filtered" class="full-width-table">
      
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> Title </th>
        <td mat-cell *matCellDef="let a"> <strong>{{ a.title }}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let a" class="truncate-text"> {{ a.description || '-' }} </td>
      </ng-container>

      <ng-container matColumnDef="classes">
        <th mat-header-cell *matHeaderCellDef> Assigned To </th>
        <td mat-cell *matCellDef="let a"> {{ classesLabel(a) }} </td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Created On </th>
        <td mat-cell *matCellDef="let a"> {{ a.createdAt | date:'mediumDate' }} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="action-header"></th>
        <td mat-cell *matCellDef="let a" class="action-cell">
          <button mat-icon-button color="warn" (click)="deleteAssignment(a)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5" style="text-align: center; padding: 24px;">
          No assignments found. Create one to get started!
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
