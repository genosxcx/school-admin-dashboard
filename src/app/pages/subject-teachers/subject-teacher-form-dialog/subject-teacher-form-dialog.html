<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <div class="form-container">
    
    <mat-form-field appearance="outline">
      <mat-label>Full Name</mat-label>
      <input matInput [(ngModel)]="model.fullName" placeholder="e.g. Jane Doe" required autofocus />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email Address</mat-label>
      <input matInput type="email" [(ngModel)]="model.email" placeholder="jane@school.edu" />
    </mat-form-field>
<mat-form-field appearance="outline" *ngIf="model.password">
      <mat-label>Generated Password (Copy this!)</mat-label>
      <input matInput [(ngModel)]="model.password" readonly />
      <mat-icon matSuffix>content_copy</mat-icon>
      <mat-hint>Give this to the teacher so they can log in.</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Subject</mat-label>
      <input matInput [(ngModel)]="model.subject" placeholder="e.g. Math, Science" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Assign Classes</mat-label>
      <mat-select [(ngModel)]="model.classIds" multiple>
        <mat-option *ngFor="let c of data.classes" [value]="c.id">
          {{ c.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!model.fullName" (click)="save()">
    Save
  </button>
</mat-dialog-actions>
