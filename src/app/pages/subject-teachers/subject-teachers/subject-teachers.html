<div class="header-actions">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search subject teachers...</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput [(ngModel)]="q" />
    <button *ngIf="q" matSuffix mat-icon-button (click)="q = ''">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <button mat-flat-button color="primary" (click)="addSubjectTeacher()" [disabled]="loading || !schoolId">
    <mat-icon>add</mat-icon>
    Add Subject Teacher
  </button>
</div>

<div class="error-msg" *ngIf="error">{{ error }}</div>

<mat-card class="table-card">
  <mat-card-content>
    <div class="loading-overlay" *ngIf="loading">
      <p>Loading...</p>
    </div>

    <table mat-table [dataSource]="filtered" class="full-width-table">
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let t"> {{ t.fullName }} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let t"> {{ t.email || '-' }} </td>
      </ng-container>

      <ng-container matColumnDef="subject">
        <th mat-header-cell *matHeaderCellDef> Subject </th>
        <td mat-cell *matCellDef="let t">
          <strong>{{ t.subject || '-' }}</strong> 
        </td>
      </ng-container>

      <ng-container matColumnDef="classes">
        <th mat-header-cell *matHeaderCellDef> Assigned Classes </th>
        <td mat-cell *matCellDef="let t"> {{ classesLabel(t) }} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="action-header"></th>
        <td mat-cell *matCellDef="let t" class="action-cell">
          <button mat-icon-button color="primary" (click)="editSubjectTeacher(t)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteSubjectTeacher(t)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5" style="text-align: center; padding: 24px;">
          No subject teachers found.
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
