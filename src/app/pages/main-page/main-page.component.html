<div class="main-container">
  <!-- Animated background -->
  <div class="bg" aria-hidden="true">
    <span class="blob blob-coral"></span>
    <span class="blob blob-sky"></span>
    <span class="blob blob-sun"></span>
    <span class="blob blob-mint"></span>
    <div class="grid-overlay"></div>
    <span class="float-letter l1">ب</span>
    <span class="float-letter l2">ت</span>
    <span class="float-letter l3">ج</span>
    <span class="float-letter l4">د</span>
    <span class="float-letter l5">ز</span>
    <span class="float-letter l6">ق</span>
  </div>

  <!-- NadaSoft Header -->
  <header class="header">
    <div class="header-content">
      <span class="eyebrow"><span class="dot"></span>Software for learning</span>
      <h1 class="brand-name">NadaSoft</h1>
      <p class="tagline">Playful, modern tools that help kids learn and teachers shine.</p>
    </div>
  </header>

  <!-- Projects Section -->
  <section class="projects-section">
    <h2 class="section-title">Our Projects</h2>

    <div class="projects-grid">
      <div
        *ngFor="let project of projects"
        class="project-card"
        (click)="navigateToProject(project.route)"
        role="button"
        tabindex="0"
        (keydown.enter)="navigateToProject(project.route)"
        (keydown.space)="navigateToProject(project.route)"
      >
        <div class="card-inner">
          <div class="project-image-wrapper">
            <img [src]="project.image" [alt]="project.name" class="project-image" />
          </div>
          <div class="project-info">
            <div>
              <h3 class="project-name">{{ project.name }}</h3>
              <p class="project-description">{{ project.description }}</p>
            </div>
            <span class="explore">
              Explore
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  d="M5 12h14M13 6l6 6-6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; {{ currentYear }} NadaSoft. All rights reserved.</p>
  </footer>
</div>
